[package]
name = "yuko"
version = "0.1.1"
edition = "2021"
description = "A Rust based validation library for Python"
license = "MIT"
documentation = "https://github.com/onuralpszr/yuko"
homepage = "https://github.com/onuralpszr/yuko"
repository = "https://github.com/onuralpszr/yuko"
keywords = ["validation", "python", "rust", "library"]
authors = ["Onuralp SEZER <thunderbirdtr@gmail.com>", "Kader MİYANYEDİ <Kadermiyanyedi@hotmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "yuko"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
pyo3 = "0.25.1"
regex = "1.11.2"
