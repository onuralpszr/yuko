[project]
name = "yuko"
version = "0.1.1"
description = "A Rust based validation library for Python"
readme = "README.md"
authors = [
    {name = "Onuralp SEZER", email = "thunderbirdtr@gmail.com"},
    {name = "Kader MİYANYEDİ", email = "Kadermiyanyedi@hotmail.com"},
]
license = {text = "MIT License"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
]

[dependency-groups]
dev = [
    "uv>=0.4.20",
    "pytest>=8.3.3",
    "ruff>=0.6.9",
    "bandit>=1.8.3",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "maturin>=1.8.1",
    "coverage>=7.6.1",
    "pytest-cov>=5.0.0",
]

[project.urls]
"Source Code" = "https://github.com/onuralpszr/yuko"
Issues = "https://github.com/onuralpszr/yuko/issues"
Documentation = "https://github.com/onuralpszr/yuko"
Changelog = "https://github.com/onuralpszr/yuko/blob/develop/CHANGELOG.md"


[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_no_return = true
ignore_missing_imports = true
exclude = '/venv/,.venv/,.git/,.tox/,.eggs/'

[tool.codespell]
ignore-words-list = 'crate,fo,fro,nam,som,tha,caf'
skip = './.git,./target,./test-crates/venvs,./guide/book,src/country_code_valid.rs'
